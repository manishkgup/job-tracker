<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker &mdash; Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="8" fill="#4f46e5"/>
          <path d="M10 18h16M18 10v16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Job Tracker</span>
      </div>
      <div class="header-right">
        <span class="welcome-text">Hi, <strong id="username-display"></strong></span>
        <button class="btn btn-outline btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stats-inner">
      <div class="stat-card" onclick="filterByStatus('')" title="Show all">
        <div class="stat-number" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card" onclick="filterByStatus('Applied')" title="Filter: Applied">
        <div class="stat-number status-applied-text" id="stat-applied">0</div>
        <div class="stat-label">Applied</div>
      </div>
      <div class="stat-card" onclick="filterByStatus('Interview')" title="Filter: Interviews">
        <div class="stat-number status-interview-text" id="stat-interview">0</div>
        <div class="stat-label">Interviews</div>
      </div>
      <div class="stat-card" onclick="filterByStatus('Offer')" title="Filter: Offers">
        <div class="stat-number status-offer-text" id="stat-offer">0</div>
        <div class="stat-label">Offers</div>
      </div>
      <div class="stat-card" onclick="filterByStatus('Rejected')" title="Filter: Rejected">
        <div class="stat-number status-rejected-text" id="stat-rejected">0</div>
        <div class="stat-label">Rejected</div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="controls">
      <div class="search-filter">
        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search company or role..." oninput="filterJobs()">
        </div>
        <select id="status-filter" onchange="filterJobs()">
          <option value="">All Statuses</option>
          <option value="Applied">Applied</option>
          <option value="Phone Screen">Phone Screen</option>
          <option value="Interview">Interview</option>
          <option value="Technical">Technical</option>
          <option value="Offer">Offer</option>
          <option value="Rejected">Rejected</option>
          <option value="Withdrawn">Withdrawn</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Application</button>
    </div>

    <div class="table-wrapper">
      <table class="jobs-table">
        <thead>
          <tr>
            <th>Company</th>
            <th>Position</th>
            <th>Status</th>
            <th>Location</th>
            <th>Applied</th>
            <th>Salary</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody">
          <tr>
            <td colspan="7" class="empty-state">No applications yet. Click &ldquo;+ Add Application&rdquo; to get started.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div id="job-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Add Application</h2>
        <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      <form id="job-form" onsubmit="saveJob(event)">
        <input type="hidden" id="job-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="company">Company <span class="required">*</span></label>
            <input type="text" id="company" placeholder="Google" required>
          </div>
          <div class="form-group">
            <label for="position">Position <span class="required">*</span></label>
            <input type="text" id="position" placeholder="Software Engineer" required>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="Applied">Applied</option>
              <option value="Phone Screen">Phone Screen</option>
              <option value="Interview">Interview</option>
              <option value="Technical">Technical</option>
              <option value="Offer">Offer</option>
              <option value="Rejected">Rejected</option>
              <option value="Withdrawn">Withdrawn</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date_applied">Date Applied</label>
            <input type="date" id="date_applied">
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="Remote / New York, NY">
          </div>
          <div class="form-group">
            <label for="salary_range">Salary Range</label>
            <input type="text" id="salary_range" placeholder="$80k – $120k">
          </div>
          <div class="form-group form-group-full">
            <label for="job_url">Job Posting URL</label>
            <input type="url" id="job_url" placeholder="https://company.com/jobs/...">
          </div>
          <div class="form-group form-group-full">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="3" placeholder="Recruiter name, interview notes, next steps..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
